[package]
name = "nikostack"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Local approval-based development workflow"

[dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
nix = { version = "0.31", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
